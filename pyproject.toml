[project]
name = "ayven-campus"
version = "2.0.2"
description = "Ayven campus and intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "llguidance==1.3.0",
]

[project.optional-dependencies]
core = ["pytest==8.3.4"]
browser = ["browser-use==0.13.10", "mcp==2.1.1"]
gpu = ["llama-cpp-python"]
memory = ["fastembed==0.7.4"]
documents = ["pypdf==6.16.2", "python-docx==1.2.0", "openpyxl==3.1.5"]
crawl = ["crawl4ai==0.7.4"]
pydantic-ai = ["pydantic-ai-slim==2.51.0"]
eval = ["pytest==8.3.4"]
sandbox = []
observability = []
frankenstein = [
  "qwen-agent==0.0.34",
  "mcp==2.1.1",
  "browser-use==0.13.10",
  "soundfile==0.14.0",
  "starlette==0.41.3",
  "sse-starlette==3.0.2",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.uv]
package = false
