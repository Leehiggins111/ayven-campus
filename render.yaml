services:
  - type: web
    name: ayven-campus
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AYVEN_LLM_STUB
        value: "1"
      - key: AYVEN_DB
        value: ./data/ayven-campus.db
      - key: PYTHONPATH
        value: "."
    healthCheckPath: /health
