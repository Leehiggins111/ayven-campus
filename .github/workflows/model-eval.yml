name: model-eval

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/ayven-v2-workable-a9eb
    paths:
      - scripts/model_eval/**
      - .github/workflows/model-eval.yml
      - apps/api/app/models.py
      - apps/api/app/intelligence/execution.py
      - apps/api/app/intelligence/deliverable.py
      - apps/api/app/intelligence/facts.py
      - apps/api/app/intelligence/research.py
      - apps/api/app/db.py
      - apps/api/app/intelligence/store.py

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: model-eval-${{ matrix.slug }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen3-8b
            model: qwen3:8b
            compare: "0"
    env:
      AYVEN_ALLOW_ESCALATION: "0"
      AYVEN_LLM_STUB: "0"
      AYVEN_RESEARCH_MODE: live
      AYVEN_LOCAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
      AYVEN_EMPLOYEE_MODEL: ${{ matrix.model }}
      AYVEN_SUPERVISOR_MODEL: ${{ matrix.model }}
      AYVEN_MANAGER_MODEL: ${{ matrix.model }}
      AYVEN_PLAN_MODEL: ${{ matrix.model }}
      AYVEN_LLM_TIMEOUT_S: "600"
      AYVEN_MAX_RESEARCH_SECONDS: "300"
      AYVEN_TIMEOUT_RESEARCH: "900"
      AYVEN_MAX_RESEARCH_ROUNDS: "1"
      AYVEN_MAX_ATTEMPTS: "1"
      AYVEN_OLLAMA_THINK: "0"
      AYVEN_AGENT_RUNTIME: native
      AYVEN_EVAL_MODEL: ${{ matrix.model }}
      AYVEN_EVAL_JOB_BUDGET_S: "5400"
      AYVEN_EVAL_OUT: eval-artifacts
      OLLAMA_NO_GPU: "1"
      OLLAMA_HOST: 127.0.0.1:11434
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-documents.txt
            apps/api/constraints.txt

      - name: Install Campus runtime
        run: |
          set -euo pipefail
          start=$(date +%s)
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-documents.txt -c apps/api/constraints.txt
          PIP_S="$(( $(date +%s) - start ))" python scripts/model_eval/record_setup.py

      - name: Record the runner and pull one model
        timeout-minutes: 50
        run: bash scripts/model_eval/pull_model.sh

      - name: Alba
        if: success()
        timeout-minutes: 100
        env:
          AYVEN_EVAL_REQUESTS: alba
          AYVEN_EVAL_COMPARE: "0"
        run: |
          if [ -f eval-artifacts/summary.json ] && grep -q skipped_disk eval-artifacts/summary.json; then
            echo "eval skipped_disk"
            exit 0
          fi
          python scripts/model_eval/harness.py

      - name: Upload Alba timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ matrix.slug }}-alba
          path: |
            eval-artifacts/alba/**
            eval-artifacts/timing.md
            eval-artifacts/timing.json
            eval-artifacts/runner.json
            eval-artifacts/setup.json
            eval-artifacts/summary.json
          if-no-files-found: warn

      - name: Alba prompt comparison
        if: ${{ !cancelled() && matrix.compare == '1' }}
        timeout-minutes: 100
        env:
          AYVEN_EVAL_REQUESTS: alba
          AYVEN_EVAL_COMPARE: "1"
          AYVEN_EVAL_COMPARE_ONLY: "1"
        run: |
          if [ ! -f eval-artifacts/alba/evidence.json ]; then
            echo "no alba evidence"
            exit 0
          fi
          python scripts/model_eval/harness.py

      - name: Coffee
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        env:
          AYVEN_EVAL_REQUESTS: coffee
          AYVEN_EVAL_COMPARE: "0"
        run: |
          if [ -f eval-artifacts/summary.json ] && grep -q skipped_disk eval-artifacts/summary.json; then
            echo "eval skipped_disk"
            exit 0
          fi
          python scripts/model_eval/harness.py

      - name: Upload Coffee timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ matrix.slug }}-coffee
          path: |
            eval-artifacts/coffee/**
            eval-artifacts/timing.md
            eval-artifacts/timing.json
            eval-artifacts/runner.json
            eval-artifacts/setup.json
          if-no-files-found: warn

      - name: Unseen
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        env:
          AYVEN_EVAL_REQUESTS: unseen
          AYVEN_EVAL_COMPARE: "0"
        run: |
          if [ -f eval-artifacts/summary.json ] && grep -q skipped_disk eval-artifacts/summary.json; then
            echo "eval skipped_disk"
            exit 0
          fi
          python scripts/model_eval/harness.py

      - name: Upload Unseen timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ matrix.slug }}-unseen
          path: |
            eval-artifacts/unseen/**
            eval-artifacts/alba-compact/**
            eval-artifacts/timing.md
            eval-artifacts/timing.json
            eval-artifacts/runner.json
            eval-artifacts/setup.json
            eval-artifacts/summary.json
          if-no-files-found: warn
