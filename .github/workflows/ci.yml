name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"
      - "codex/**"

jobs:
  non-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AYVEN_ALLOW_ESCALATION: "0"
      AYVEN_LLM_STUB: "1"
      AYVEN_RESEARCH_MODE: fixtures
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-frankenstein.txt
            apps/api/requirements-documents.txt
            apps/api/requirements-crawl.txt
            apps/api/requirements-memory.txt
            apps/api/requirements-pydantic-ai.txt
            apps/api/constraints.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: ayven-models-${{ runner.os }}-bge-small-en-v1.5

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # Core, Frankenstein, documents, and pydantic-ai resolve under constraints.
          # Crawl4AI allows pillow>=10.4. fastembed declares pillow<12, so the memory
          # extra is installed on its own and the pins are reapplied afterwards.
          python -m pip install \
            -r apps/api/requirements.txt \
            -r apps/api/requirements-frankenstein.txt \
            -r apps/api/requirements-documents.txt \
            -r apps/api/requirements-pydantic-ai.txt \
            -c apps/api/constraints.txt
          python -m pip install -r apps/api/requirements-crawl.txt -c apps/api/constraints.txt
          python -m pip install -r apps/api/requirements-memory.txt
          python -m pip install click==8.3.3 pillow==12.3.0
          python -m playwright install --with-deps chromium

      - name: Allow the sandbox user namespace
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net true

      - name: Dependency lock
        run: python scripts/check_dependency_lock.py

      - name: Compile
        run: python -m compileall -q apps/api/app validation scripts

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
          HF_HOME: /home/runner/.cache/huggingface
        run: python -m pytest apps/api/tests -q --tb=short
